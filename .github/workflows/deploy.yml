# ============================================================
#  自动构建并发布到 GitHub Pages
#
#  ⚠️ 前提：仓库的 Settings → Pages → Source 必须选
#     **GitHub Actions**（不是 "Deploy from a branch"）。
#
#  为什么改成 Actions 而不是「从分支根目录发布」：
#     重构后仓库根目录是**源码**（Vue + TypeScript），浏览器不能直接跑，
#     必须先用 Vite 构建出 dist/ 才能发布。
# ============================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 只保留最新一次部署，排队中的旧任务自动取消
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建（含类型检查）
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
