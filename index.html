<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TavernGame · 游戏</title>
  <meta name="description" content="agent 驱动的文字游戏" />
  <style>
    :root {
      --bg:      #0d0f1a;
      --panel:   #141828;
      --panel-2: #1b2035;
      --accent:  #6ee7b7;
      --accent2: #7dd3fc;
      --warn:    #fbbf24;
      --danger:  #f87171;
      --text:    #e8ecf5;
      --dim:     #8b95b0;
      --faint:   #555e78;
      --border:  rgba(110, 231, 183, 0.18);
      --radius:  12px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      /* 防止拖选文字影响操作（-webkit- 前缀兼容 Safari） */
      user-select: none;
      -webkit-user-select: none;
    }

    /* 输入框必须允许选中，否则没法编辑 */
    textarea, input { user-select: text; -webkit-user-select: text; }

    /* 用 100% 而不是 100vh：手机浏览器地址栏伸缩时 vh 会算错，导致底部被裁 */
    body { display: flex; flex-direction: column; height: 100%; overflow: hidden; }

    /* ---------- 顶栏 ---------- */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-shrink: 0;
    }

    .logo { font-weight: 700; letter-spacing: 0.08em; font-size: 13.5px; color: var(--accent); }

    .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }

    .light { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); transition: background 0.3s; }
    .light.ok   { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .light.warn { background: var(--warn);   box-shadow: 0 0 8px var(--warn); }
    .light.err  { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

    header .spacer { margin-left: auto; }

    /* ---------- 通用按钮 ---------- */
    button {
      padding: 7px 15px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel-2);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.18s, transform 0.12s;
      white-space: nowrap;
    }
    button:hover:not(:disabled) { background: rgba(110, 231, 183, 0.16); }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary {
      background: linear-gradient(180deg, rgba(110, 231, 183, 0.22), rgba(110, 231, 183, 0.08));
      font-weight: 600;
    }
    button.ghost { background: transparent; border-color: transparent; color: var(--dim); }
    button.ghost:hover { color: var(--text); background: rgba(255, 255, 255, 0.05); }

    /* ---------- 布局 ---------- */
    .layout { display: grid; grid-template-columns: 1fr 280px; flex: 1; min-height: 0; }

    .main { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); }

    /* ---------- 叙事区 ---------- */
    .story {
      flex: 1; overflow-y: auto; padding: 22px 26px;
      display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth;
    }
    .story::-webkit-scrollbar { width: 8px; }
    .story::-webkit-scrollbar-thumb { background: rgba(110, 231, 183, 0.18); border-radius: 4px; }

    .line { line-height: 1.85; font-size: 15px; max-width: 70ch; white-space: pre-wrap; }
    .line.narration { color: #c8d0e2; }
    .line.action {
      color: var(--accent2); padding-left: 12px;
      border-left: 2px solid rgba(125, 211, 252, 0.4);
    }
    .line.system {
      color: var(--faint); font-size: 12.5px; padding: 9px 13px;
      border: 1px dashed rgba(139, 149, 176, 0.25); border-radius: 10px;
      background: rgba(139, 149, 176, 0.05);
    }
    .line.system.error { border-color: rgba(248, 113, 113, 0.45); color: #f0a5a5; background: rgba(248, 113, 113, 0.06); }
    .line.system.tool {
      border-color: rgba(125, 211, 252, 0.25); color: #9fc4e0;
      background: rgba(125, 211, 252, 0.05); font-family: Consolas, monospace;
    }
    .line.system strong { color: var(--warn); }
    .line.system code {
      background: rgba(110, 231, 183, 0.1); color: var(--accent);
      padding: 1px 5px; border-radius: 4px; font-size: 12px;
    }

    .thinking { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 13px; }
    .thinking .dot2 { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
    .thinking .dot2:nth-child(3) { animation-delay: 0.2s; }
    .thinking .dot2:nth-child(4) { animation-delay: 0.4s; }
    @keyframes blink { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }

    /* ---------- 输入区 ---------- */
    .composer { flex-shrink: 0; padding: 11px 14px 14px; border-top: 1px solid var(--border); background: var(--panel); }
    .composer-row { display: flex; gap: 9px; align-items: flex-end; }

    textarea {
      flex: 1; resize: none; min-height: 42px; max-height: 130px;
      padding: 11px 13px; border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--panel-2); color: var(--text); font-family: inherit;
      font-size: 14px; line-height: 1.5; outline: none; transition: border-color 0.2s;
    }
    textarea:focus { border-color: rgba(110, 231, 183, 0.5); }
    textarea::placeholder { color: var(--faint); }

    .hint { margin-top: 7px; font-size: 11px; color: var(--faint); min-height: 14px; }

    /* ---------- 侧栏 ---------- */
    .sidebar { display: flex; flex-direction: column; gap: 12px; padding: 16px 14px; overflow-y: auto; background: var(--panel); }

    .card { border: 1px solid var(--border); border-radius: var(--radius); padding: 13px; background: var(--panel-2); }
    .card h2 {
      margin: 0 0 10px; font-size: 10.5px; font-weight: 600;
      letter-spacing: 0.14em; color: var(--faint); text-transform: uppercase;
    }

    .stat { display: flex; justify-content: space-between; align-items: baseline; padding: 3px 0; font-size: 13px; }
    .stat span:first-child { color: var(--dim); }
    .stat span:last-child { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }

    .bar { height: 5px; margin: 5px 0 2px; border-radius: 3px; background: rgba(255,255,255,0.07); overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.4s ease; }
    .bar.low i { background: var(--danger); }

    .empty { font-size: 12px; color: var(--faint); font-style: italic; margin: 0; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag {
      font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
      background: rgba(110, 231, 183, 0.1); color: var(--accent);
      border: 1px solid rgba(110, 231, 183, 0.2);
    }

    /* ---------- 设置面板 ---------- */
    .drawer {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(5, 7, 14, 0.72); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .drawer[hidden] { display: none; }

    .sheet {
      width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto;
      border: 1px solid var(--border); border-radius: 16px;
      background: var(--panel); padding: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }
    .sheet h2 { margin: 0 0 6px; font-size: 17px; }
    .sheet .sub { margin: 0 0 20px; font-size: 13px; color: var(--dim); line-height: 1.7; }

    .field { margin-bottom: 15px; }
    .field label { display: block; margin-bottom: 6px; font-size: 12.5px; color: var(--dim); }
    .field input, .field select {
      width: 100%; padding: 9px 12px; border: 1px solid var(--border);
      border-radius: 9px; background: var(--panel-2); color: var(--text);
      font-family: inherit; font-size: 13.5px; outline: none;
    }
    .field input:focus, .field select:focus { border-color: rgba(110, 231, 183, 0.5); }
    .field .note { margin-top: 5px; font-size: 11.5px; color: var(--faint); line-height: 1.6; }
    .field .note a { color: var(--accent2); }

    .sheet-actions { display: flex; gap: 9px; margin-top: 20px; flex-wrap: wrap; }
    .sheet-actions .right { margin-left: auto; }

    .result { margin-top: 14px; padding: 11px 13px; border-radius: 9px; font-size: 13px; line-height: 1.7; }
    .result.ok  { background: rgba(110, 231, 183, 0.1); border: 1px solid rgba(110, 231, 183, 0.3); color: var(--accent); }
    .result.bad { background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.3); color: #f0a5a5; white-space: pre-wrap; }

    /* ---------- 窄屏 ---------- */
    @media (max-width: 780px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-top: 1px solid var(--border); max-height: 40vh; }
      .main { border-right: none; }
    }
  </style>
</head>
<body>

  <header>
    <span class="logo">TAVERNGAME</span>
    <span class="status">
      <span class="light" id="light"></span>
      <span id="status-text">检查配置…</span>
    </span>
    <span class="spacer"></span>
    <button id="btn-save" class="ghost" title="导出存档文件">导出存档</button>
    <button id="btn-load" class="ghost" title="从文件导入存档">导入</button>
    <button id="btn-reset" class="ghost" title="重新开始">重来</button>
    <button id="btn-settings">⚙ 设置</button>
  </header>

  <div class="layout">
    <section class="main">
      <div class="story" id="story"></div>

      <div class="composer">
        <div class="composer-row">
          <textarea id="input" rows="1" placeholder="你想做什么？"></textarea>
          <button id="btn-send" class="primary">行动</button>
          <button id="btn-stop" hidden>停止</button>
        </div>
        <div class="hint" id="hint"></div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="card">
        <h2>角色</h2>
        <div class="stat"><span id="p-name">—</span><span id="p-hp">—</span></div>
        <div class="bar" id="hp-bar"><i style="width:100%"></i></div>
        <div id="p-stats"></div>
      </div>
      <div class="card">
        <h2>背包</h2>
        <div id="p-inv"></div>
      </div>
      <div class="card">
        <h2>场景</h2>
        <div id="p-scene"></div>
      </div>
      <div class="card">
        <h2>人物</h2>
        <div id="p-npcs"></div>
      </div>
      <div class="card">
        <h2>回合</h2>
        <div class="stat"><span>已进行</span><span id="p-turn">0</span></div>
      </div>
    </aside>
  </div>

  <!-- ---------- 设置面板 ---------- -->
  <div class="drawer" id="drawer" hidden>
    <div class="sheet">
      <h2>设置</h2>
      <p class="sub">
        纯前端运行 —— 你的 API key 只保存在<b>你自己的浏览器</b>里，
        不会上传到任何服务器。请求直接从浏览器发往服务商。
      </p>

      <div class="field">
        <label>服务商</label>
        <select id="f-provider"></select>
        <div class="note" id="n-provider"></div>
      </div>

      <div class="field">
        <label>API Key</label>
        <input id="f-key" type="password" placeholder="sk-..." autocomplete="off" />
        <div class="note" id="n-key"></div>
      </div>

      <div class="field">
        <label>接口地址（Base URL）</label>
        <input id="f-base" type="text" placeholder="https://api.deepseek.com" autocomplete="off" />
      </div>

      <div class="field">
        <label>模型</label>
        <input id="f-model" type="text" list="model-list" autocomplete="off" />
        <datalist id="model-list"></datalist>
      </div>

      <div class="field">
        <label>每回合最多思考步数：<span id="n-steps">8</span></label>
        <input id="f-steps" type="range" min="1" max="20" value="8" style="width:100%" />
        <div class="note">防止模型陷入循环把额度烧光。</div>
      </div>

      <div class="sheet-actions">
        <button id="btn-test">测试连接</button>
        <button id="btn-save-cfg" class="primary">保存</button>
        <button id="btn-forget" class="ghost right">清除密钥</button>
      </div>

      <div id="cfg-result"></div>
    </div>
  </div>

  <script type="module">
    import { GameState } from './core/state.js';
    import { runTurn } from './core/agent.js';
    import { loadConfig, saveConfig, clearConfig, isConfigured, PRESETS, maskKey } from './core/config.js';
    import { testConnection } from './core/llm.js';

    // ---------- 元素引用 ----------
    const $ = (id) => document.getElementById(id);
    const el = {
      story: $('story'), input: $('input'), hint: $('hint'),
      send: $('btn-send'), stop: $('btn-stop'),
      light: $('light'), statusText: $('status-text'),
      drawer: $('drawer'),
      pName: $('p-name'), pHp: $('p-hp'), hpBar: $('hp-bar'),
      pStats: $('p-stats'), pInv: $('p-inv'), pScene: $('p-scene'),
      pNpcs: $('p-npcs'), pTurn: $('p-turn'),
      result: $('cfg-result'),
    };

    let state = GameState.load();
    let history = [];
    let controller = null;   // AbortController，用于「停止」

    // 调试模式：显示模型的原始输出，用来排查「为什么不按格式调用工具」。
    // 在浏览器控制台执行  __DEBUG = true  即可打开（刷新后失效）。
    let debugMode = false;
    Object.defineProperty(window, '__DEBUG', {
      get: () => debugMode,
      set: (v) => {
        debugMode = Boolean(v);
        append(debugMode
          ? '🔧 调试模式已开启 —— 之后会显示模型的原始输出'
          : '🔧 调试模式已关闭', 'system');
      },
    });

    // ---------- 界面：追加内容 ----------
    function append(text, kind = 'narration') {
      const div = document.createElement('div');
      div.className = `line ${kind}`;
      div.textContent = text;
      el.story.appendChild(div);
      el.story.scrollTop = el.story.scrollHeight;
      return div;
    }

    function showThinking(on) {
      const id = 'thinking-indicator';
      document.getElementById(id)?.remove();
      if (!on) return;
      const div = document.createElement('div');
      div.id = id;
      div.className = 'thinking';
      div.innerHTML = '<span class="dot2"></span><span class="dot2"></span><span class="dot2"></span><span>思考中…</span>';
      el.story.appendChild(div);
      el.story.scrollTop = el.story.scrollHeight;
    }

    // ---------- 界面：刷新状态面板 ----------
    function renderState() {
      const p = state.player;
      el.pName.textContent = p.name;
      el.pHp.textContent = `${p.hp} / ${p.hpMax}`;

      const pct = Math.max(0, Math.min(100, (p.hp / p.hpMax) * 100));
      el.hpBar.querySelector('i').style.width = `${pct}%`;
      el.hpBar.classList.toggle('low', pct <= 30);

      el.pStats.innerHTML = Object.entries(p.stats)
        .map(([k, v]) => `<div class="stat"><span>${k}</span><span>${v}</span></div>`)
        .join('');

      el.pInv.innerHTML = p.inventory.length
        ? `<div class="tag-list">${p.inventory.map((i) => `<span class="tag">${escapeHtml(i)}</span>`).join('')}</div>`
        : '<p class="empty">（空）</p>';

      el.pScene.innerHTML = `<div style="font-size:13px;color:var(--accent);margin-bottom:5px">${escapeHtml(state.scene.name)}</div>
        <div style="font-size:12.5px;color:var(--dim);line-height:1.7">${escapeHtml(state.scene.description)}</div>`;

      el.pNpcs.innerHTML = state.data.npcs.length
        ? state.data.npcs.map((n) =>
            `<div style="font-size:12.5px;margin-bottom:5px">
               <span style="color:var(--accent2)">${escapeHtml(n.name)}</span>
               <span style="color:var(--faint)"> · ${escapeHtml(n.attitude)}</span>
             </div>`).join('')
        : '<p class="empty">（暂无）</p>';

      el.pTurn.textContent = state.turn;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ---------- 配置状态 ----------
    function refreshStatus() {
      const cfg = loadConfig();
      if (!isConfigured()) {
        el.light.className = 'light warn';
        el.statusText.textContent = '未配置';
        el.hint.innerHTML = '还没配置 API key —— 点右上角 <b>⚙ 设置</b> 填一下就能开始';
        el.send.disabled = true;
        return false;
      }
      el.light.className = 'light ok';
      el.statusText.textContent = `${PRESETS[cfg.provider]?.label || cfg.provider} · ${cfg.model}`;
      el.hint.textContent = 'Enter 发送 · Shift+Enter 换行';
      el.send.disabled = false;
      return true;
    }

    // ---------- 回合执行 ----------
    async function doTurn(action) {
      if (!isConfigured()) { openSettings(); return; }

      el.send.disabled = true;
      el.stop.hidden = false;
      el.input.disabled = true;

      if (action) append(action, 'action');
      showThinking(true);

      controller = new AbortController();

      try {
        const result = await runTurn(state, {
          action,
          history,
          signal: controller.signal,
          onEvent: (evt) => {
            // 每一步开始都提示一次，让玩家知道 agent 在转圈而不是卡住了
            if (evt.type === 'thinking') {
              showThinking(true);
            }
            if (evt.type === 'narration') {
              // 叙事是分批到达的（每步一段），到达时先撤掉「思考中」
              showThinking(false);
            }
            // 调试模式：把模型的原始回复完整打出来
            if (evt.type === 'raw' && debugMode) {
              const div = document.createElement('details');
              div.className = 'line system tool';
              div.style.cursor = 'pointer';
              const summary = document.createElement('summary');
              summary.textContent = `🔍 模型原始输出（解析出 ${evt.blocks} 个工具块）—— 点击展开`;
              const pre = document.createElement('pre');
              pre.style.cssText = 'white-space:pre-wrap;margin:8px 0 0;font-size:12px;line-height:1.6';
              pre.textContent = evt.text;
              div.append(summary, pre);
              el.story.appendChild(div);
              el.story.scrollTop = el.story.scrollHeight;
            }
            if (evt.type === 'tool') {
              append(`⚙ 调用 ${evt.tool}(${JSON.stringify(evt.args)})`, 'system tool');
            }
            if (evt.type === 'toolResult') {
              append(`   → ${evt.result}`, 'system tool');
            }
            if (evt.type === 'warn') {
              append(`⚠ ${evt.message}`, 'system');
            }
          },
        });

        history = result.history;
        renderState();
        if (!result.text) append('（模型没有返回文字，可能只调用了工具）', 'system');

      } catch (err) {
        if (err.name === 'AbortError') {
          append('已取消本回合', 'system');
        } else {
          append(`出错了：\n${err.message}`, 'system error');
          el.light.className = 'light err';
        }
      } finally {
        showThinking(false);
        controller = null;
        el.stop.hidden = true;
        el.input.disabled = false;
        el.send.disabled = false;
        el.input.focus();
        renderState();
      }
    }

    // ---------- 事件绑定 ----------

    el.input.addEventListener('input', () => {
      el.input.style.height = 'auto';
      el.input.style.height = `${Math.min(el.input.scrollHeight, 130)}px`;
    });

    el.input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submit();
      }
    });

    el.send.addEventListener('click', submit);
    el.stop.addEventListener('click', () => controller?.abort());

    function submit() {
      const text = el.input.value.trim();
      if (!text) return;
      el.input.value = '';
      el.input.style.height = 'auto';
      doTurn(text);
    }

    // 导出 / 导入 / 重来
    document.getElementById('btn-save').addEventListener('click', () => {
      const blob = new Blob([state.export()], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `taverngame-存档-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      append('存档已导出为文件', 'system');
    });

    document.getElementById('btn-load').addEventListener('click', () => {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = '.json,application/json';
      inp.onchange = async () => {
        const file = inp.files?.[0];
        if (!file) return;
        try {
          state.import(await file.text());
          history = [];
          el.story.innerHTML = '';
          append('存档已导入 ✓', 'system');
          for (const entry of state.data.log.slice(-12)) append(entry.text, entry.kind);
          renderState();
        } catch (err) {
          append(`导入失败：${err.message}`, 'system error');
        }
      };
      inp.click();
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      if (!confirm('确定要重新开始吗？当前进度会丢失（建议先导出存档）')) return;
      state.reset();
      history = [];
      el.story.innerHTML = '';
      renderState();
      startNewGame();
    });

    // ---------- 设置面板 ----------
    function openSettings() {
      const cfg = loadConfig();

      const sel = $('f-provider');
      sel.innerHTML = Object.entries(PRESETS)
        .map(([k, v]) => `<option value="${k}" ${k === cfg.provider ? 'selected' : ''}>${v.label}</option>`)
        .join('');

      $('f-key').value = cfg.apiKey;
      $('f-base').value = cfg.apiBase;
      $('f-model').value = cfg.model;
      $('f-steps').value = cfg.maxAgentSteps;
      $('n-steps').textContent = cfg.maxAgentSteps;
      el.result.innerHTML = '';

      syncProviderFields();
      el.drawer.hidden = false;
    }

    function syncProviderFields() {
      const key = $('f-provider').value;
      const p = PRESETS[key];
      if (!p) return;

      // 切换服务商时，如果接口地址还是上一个的默认值，就自动替换
      const cur = $('f-base').value.trim();
      const isOldDefault = Object.values(PRESETS).some((x) => x.apiBase === cur);
      if (!cur || isOldDefault) $('f-base').value = p.apiBase;

      const curModel = $('f-model').value.trim();
      const isOldModel = Object.values(PRESETS).some((x) => x.models?.includes(curModel));
      if (!curModel || isOldModel) $('f-model').value = p.models?.[0] || '';

      $('model-list').innerHTML = (p.models || []).map((m) => `<option value="${m}">`).join('');

      $('n-provider').textContent = p.corsOk === false
        ? '⚠️ 该服务商实测不允许浏览器直连（CORS），用不了'
        : p.corsOk === true ? '✅ 实测支持浏览器直连' : '未实测，可能需要代理';

      $('n-key').innerHTML = p.noKey
        ? '这个服务不需要 key'
        : (p.keyUrl ? `在这里获取：<a href="${p.keyUrl}" target="_blank" rel="noopener">${p.keyUrl}</a>` : '')
          + `<br>当前：${maskKey(loadConfig().apiKey)}`;

      $('f-key').disabled = Boolean(p.noKey);
    }

    $('f-provider').addEventListener('change', syncProviderFields);
    $('f-steps').addEventListener('input', (e) => { $('n-steps').textContent = e.target.value; });

    $('btn-settings').addEventListener('click', openSettings);
    el.drawer.addEventListener('click', (e) => { if (e.target === el.drawer) el.drawer.hidden = true; });

    $('btn-save-cfg').addEventListener('click', () => {
      saveConfig({
        provider: $('f-provider').value,
        apiKey: $('f-key').value.trim(),
        apiBase: $('f-base').value.trim(),
        model: $('f-model').value.trim(),
        maxAgentSteps: Number($('f-steps').value),
      });
      el.drawer.hidden = true;
      refreshStatus();
      append('设置已保存 ✓', 'system');
      if (!history.length && state.turn === 0) startNewGame();
    });

    $('btn-test').addEventListener('click', async () => {
      // 先用表单里的值试，不必先保存
      saveConfig({
        provider: $('f-provider').value,
        apiKey: $('f-key').value.trim(),
        apiBase: $('f-base').value.trim(),
        model: $('f-model').value.trim(),
      });
      el.result.className = 'result';
      el.result.textContent = '测试中…';
      try {
        const r = await testConnection();
        el.result.className = 'result ok';
        el.result.textContent = `✅ 连接成功（${r.ms}ms）· 回复：${r.reply}`;
      } catch (err) {
        el.result.className = 'result bad';
        el.result.textContent = `❌ 失败\n${err.message}`;
      }
    });

    $('btn-forget').addEventListener('click', () => {
      if (!confirm('清除浏览器里保存的 API key？')) return;
      clearConfig();
      $('f-key').value = '';
      el.result.className = 'result';
      el.result.textContent = '已清除';
      refreshStatus();
    });

    // ---------- 开新游戏 ----------
    async function startNewGame() {
      append('（正在生成开场…）', 'system');
      await doTurn(null);
    }

    // ---------- 启动 ----------
    refreshStatus();
    renderState();

    // 恢复上次的叙事日志
    for (const entry of state.data.log.slice(-20)) {
      append(entry.text, entry.kind);
    }

    if (isConfigured()) {
      if (state.turn === 0) {
        startNewGame();
      } else {
        append(`继续游戏（第 ${state.turn} 回合）`, 'system');
      }
    } else {
      append('欢迎。请先点右上角「⚙ 设置」填入 API key。', 'system');
      setTimeout(openSettings, 400);
    }
  </script>
</body>
</html>
