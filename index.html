<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TavernGame · 酒馆守卫</title>
  <meta name="description" content="一个用原生 JavaScript 与 Canvas 编写的网页小游戏" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <!-- 游戏主容器：所有画面都画在这块画布上 -->
  <main id="stage">
    <canvas id="game"></canvas>

    <!-- 左上角信息面板（HUD = Head-Up Display，游戏术语，指常驻界面信息） -->
    <div id="hud" class="hud">
      <div class="hud-item">
        <span class="hud-label">得分</span>
        <span class="hud-value" id="score">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">存活</span>
        <span class="hud-value" id="time">0.0s</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">生命</span>
        <span class="hud-value" id="hp">100</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">最高分</span>
        <span class="hud-value" id="best">0</span>
      </div>
    </div>

    <!-- 开始 / 结束遮罩层 -->
    <div id="overlay" class="overlay">
      <h1 class="overlay-title">酒馆守卫</h1>
      <p class="overlay-desc" id="overlay-desc">
        用鼠标瞄准，点击或按空格射击<br />
        WASD 或方向键移动
      </p>
      <ul class="overlay-keys">
        <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</li>
        <li><kbd>空格</kbd> / <kbd>鼠标左键</kbd> 射击</li>
        <li><kbd>P</kbd> 暂停</li>
      </ul>
      <button id="btn-start" class="btn" type="button">开始游戏</button>
    </div>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
