<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 标题与描述在挂载时由 i18n 写进去（src/composables/useLanguage.ts）——
         这里是 ASCII 占位，规则见 .githooks/checks/ascii.mjs -->
    <title>TavernGame</title>
    <meta name="description" content="An agent-driven text game" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      // 在 Vue 挂载前定好主题，否则会「先亮一下再变暗」。
      // 逻辑必须与 src/composables/useTheme.ts 一致（内联脚本无法 import）
      ;(function () {
        var stored = localStorage.getItem('tavernGame.theme') || 'system'
        var dark =
          stored === 'dark' ||
          (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
